<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Meshview{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* --- Tokens ----------------------------------------------------
     A network-analyzer aesthetic: dark instrument-panel background,
     a signal-teal accent for live/active data, amber reserved for
     anomalies and warnings. Monospace is used for actual packet data
     (addresses, ports, hex) because that's the convention operators
     expect -- not decoration. UI chrome stays sans-serif.
  ----------------------------------------------------------------- */
  :root {
    --bg: #0b0f13;
    --bg-glow-1: #123832;
    --bg-glow-2: #0e1a2e;
    --panel: #141b21;
    --panel-raised: #1a232a;
    --panel-hover: #202b33;
    --border: #263039;
    --border-soft: #1d262d;
    --text: #dde4e9;
    --text-dim: #8a97a1;
    --accent: #3ddbc4;
    --accent-soft: #3ddbc42e;
    --accent-dim: #1f5f56;
    --accent-glow: rgba(61, 219, 196, 0.35);
    --warn: #e0a940;
    --danger: #e0654a;
    --ok: #6fdb8c;
    --radius: 8px;
    --radius-lg: 12px;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { box-sizing: border-box; }

  ::selection { background: var(--accent-soft); color: var(--text); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 6px;
    border: 2px solid var(--panel);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient, slow-drifting glow behind everything -- a network "pulse"
     rather than decoration for its own sake. Purely CSS, GPU-composited
     (transform/opacity only), and turned off for reduced-motion. */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(38rem 26rem at 12% -8%, var(--bg-glow-1), transparent 60%),
      radial-gradient(34rem 24rem at 108% 12%, var(--bg-glow-2), transparent 55%);
    opacity: 0.55;
    animation: drift 22s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(-2%, 1.5%, 0) scale(1.04); }
  }

  a { color: var(--accent); }

  header.app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 22px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(20, 27, 33, 0.82);
    backdrop-filter: blur(10px) saturate(1.4);
    -webkit-backdrop-filter: blur(10px) saturate(1.4);
  }

  .brand-block { display: flex; align-items: center; gap: 10px; }

  .brand-mark {
    width: 30px;
    height: 30px;
    flex: none;
    display: grid;
    place-items: center;
  }

  .brand-mark svg { width: 100%; height: 100%; overflow: visible; }

  .brand-mark .node { fill: var(--accent); }
  .brand-mark .ring {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.4;
    opacity: 0.45;
    transform-origin: center;
    animation: ring-pulse 3.2s var(--ease) infinite;
  }
  .brand-mark .ring.delay { animation-delay: 1.1s; }

  @keyframes ring-pulse {
    0%   { transform: scale(0.55); opacity: 0.55; }
    70%  { transform: scale(1.15); opacity: 0; }
    100% { transform: scale(1.15); opacity: 0; }
  }

  .brand { font-weight: 600; letter-spacing: 0.01em; font-size: 15px; line-height: 1.2; }
  .tagline { color: var(--text-dim); font-size: 11.5px; margin-top: 1px; }

  header.app-header nav {
    display: flex;
    gap: 2px;
    position: relative;
    background: var(--panel-raised);
    padding: 3px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
  }

  header.app-header nav a {
    position: relative;
    z-index: 1;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 999px;
    transition: color 0.25s var(--ease);
  }

  header.app-header nav a:hover { color: var(--text); }

  header.app-header nav a.active {
    color: #08201c;
    font-weight: 600;
  }

  header.app-header nav a.active::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--accent);
    border-radius: 999px;
    box-shadow: 0 0 0 1px var(--accent), 0 2px 14px -2px var(--accent-glow);
    animation: tab-pop 0.32s var(--ease-out-back);
  }

  @keyframes tab-pop {
    from { transform: scale(0.85); opacity: 0.4; }
    to   { transform: scale(1); opacity: 1; }
  }

  main {
    position: relative;
    z-index: 1;
    padding: 22px;
    max-width: 1520px;
    margin: 0 auto;
    animation: page-in 0.45s var(--ease) both;
  }

  @keyframes page-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel) 60%, var(--panel-raised));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 10px 30px -18px rgba(0,0,0,0.6);
    transition: border-color 0.25s var(--ease);
  }

  button, select, input {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text);
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 11px;
    transition: border-color 0.2s var(--ease), background 0.2s var(--ease),
                box-shadow 0.2s var(--ease), transform 0.12s var(--ease);
  }

  select, input { outline: none; }

  select:hover, input:hover { border-color: var(--accent-dim); }

  select:focus-visible, input:focus-visible, button:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  button {
    cursor: pointer;
    font-weight: 500;
  }

  button:hover {
    border-color: var(--accent-dim);
    background: var(--panel-hover);
  }

  button:active { transform: scale(0.97); }

  button.primary {
    background: var(--accent);
    color: #08201c;
    border-color: var(--accent);
    font-weight: 600;
    box-shadow: 0 2px 16px -4px var(--accent-glow);
  }

  button.primary:hover {
    filter: brightness(1.08);
    box-shadow: 0 4px 20px -4px var(--accent-glow);
    transform: translateY(-1px);
  }

  button.primary:active { transform: translateY(0) scale(0.97); }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  code, .mono { font-family: var(--mono); }

  /* --- Shared motion / status primitives, used across pages --------- */
  .spinner {
    display: inline-block;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .skeleton {
    background: linear-gradient(90deg, var(--panel-raised) 25%, var(--panel-hover) 37%, var(--panel-raised) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 4px;
  }

  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }

  .pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    position: relative;
  }

  .pulse-dot::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: inherit;
    opacity: 0.55;
    animation: dot-pulse 1.6s var(--ease) infinite;
  }

  @keyframes dot-pulse {
    0%   { transform: scale(0.6); opacity: 0.55; }
    100% { transform: scale(2.1); opacity: 0; }
  }

  .fade-in { animation: fade-in 0.3s var(--ease) both; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .rise-in { animation: rise-in 0.28s var(--ease) both; }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    body::before { animation: none; }
  }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
<header class="app-header">
  <div class="brand-block">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 30 30">
        <circle class="ring" cx="15" cy="15" r="6"></circle>
        <circle class="ring delay" cx="15" cy="15" r="6"></circle>
        <circle class="node" cx="15" cy="15" r="4.5"></circle>
      </svg>
    </span>
    <div>
      <div class="brand">Meshview</div>
      <div class="tagline">See your network traffic in 3D</div>
    </div>
  </div>
  <nav>
    <a href="{% url 'packet-table' %}" class="{% block nav_table %}{% endblock %}">Packet Table</a>
    <a href="{% url 'scene' %}" class="{% block nav_scene %}{% endblock %}">3D View</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block extra_script %}{% endblock %}
</body>
</html>
